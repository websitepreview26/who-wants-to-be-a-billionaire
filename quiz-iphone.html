    #quiz-stage {
      color: var(--ink);
      font: 16px/1.45 Manrope, system-ui, sans-serif;
      overflow-wrap: anywhere;
    }
    #quiz-stage * { box-sizing: border-box; }
    #quiz-stage [hidden] { display: none !important; }
    #quiz-stage :is(h1, h2, p) { margin: 0; font-family: inherit; }
    #quiz-stage :is(button, input, select, textarea) { font: inherit; }
    #quiz-stage :is(button, input, select, textarea):focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 3px;
    }
    #quiz-stage button {
      min-block-size: 44px;
      border: 0;
      border-radius: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      touch-action: manipulation;
    }
    #quiz-stage button.primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-block-size: 50px;
      padding: 10px 15px;
      border-radius: 3px;
      background: var(--action);
      color: var(--action-text);
      text-align: left;
      font-weight: 700;
    }
    #quiz-stage button.primary::after { content: '→' / ''; font-size: 1.2em; line-height: 1; }
    #quiz-stage button.primary:disabled { opacity: .45; }
    #quiz-stage button.primary:not(:disabled):active { opacity: .82; }
    #quiz-stage .shell {
      --gutter: clamp(16px, 4.4vw, 46px);
      --safe-top: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
      --safe-right: max(env(safe-area-inset-right, 0px), calc(var(--tg-safe-area-inset-right, 0px) + var(--tg-content-safe-area-inset-right, 0px)));
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px)));
      --safe-left: max(env(safe-area-inset-left, 0px), calc(var(--tg-safe-area-inset-left, 0px) + var(--tg-content-safe-area-inset-left, 0px)));
      max-inline-size: 1040px;
      margin-inline: auto;
      padding: calc(10px + var(--safe-top)) calc(var(--gutter) + var(--safe-right))
        calc(clamp(16px, 3vw, 30px) + var(--safe-bottom)) calc(var(--gutter) + var(--safe-left));
      background: var(--stage);
    }
    #quiz-stage header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-block-size: 50px;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    #quiz-stage header button {
      flex: none;
      margin-inline-start: auto;
      color: var(--muted);
      font-size: .8125rem;
      font-weight: 700;
    }
    #quiz-stage header button:active, #quiz-stage .quiet:active { color: var(--signal); }
    #quiz-stage .eyebrow {
      color: var(--muted);
      font-size: .6875rem;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    #quiz-stage .clock-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
    }
    #quiz-stage .clock-track {
      padding-bottom: 6px;
      background: repeating-linear-gradient(to right, var(--muted) 0 1px, transparent 1px calc(100% / 6))
        left bottom / 100% 4px no-repeat;
      border-inline-end: 1px solid var(--muted);
    }
    #quiz-stage .time {
      color: var(--muted);
      font-size: 1.125rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #quiz-stage[data-phase="answer"] .time, #quiz-stage .time.urgent { color: var(--signal); }
    #quiz-stage progress {
      display: block;
      appearance: none;
      inline-size: 100%;
      block-size: 3px;
      margin: 0;
      border: 0;
      background: var(--line);
    }
    #quiz-stage progress::-webkit-progress-bar { background: var(--line); }
    #quiz-stage progress::-webkit-progress-value { background: var(--muted); }

<script>
  (() => {
    const root = document.getElementById('quiz-stage');
    const find = (name) => root.querySelector('#quiz-' + name);
    const game = find('game');
    const editor = find('editor');
    const editButton = find('edit');
    const question = find('question');
    const answers = find('answers');
    const bank = find('bank');
    const hint = find('hint');
    const sidebar = find('sidebar');
    const hintButtons = Array.from(find('lifelines').querySelectorAll('button'));
    const ladderDialog = find('ladder-dialog');
    const questionPicker = find('list');
    const counter = find('counter');
    const clock = find('time');
    const clockRow = find('clock');
    const progress = find('progress');
    const form = find('form');
    const status = find('status');
    const editorStatus = find('editor-status');
    const action = find('action');
    const voice = find('voice');
    const synth = window.speechSynthesis;
    const storageKey = 'quiz-stage-questions-v1';
    const letters = ['A', 'B', 'C', 'D'];
    const prizes = [500, 1000, 2000, 3000, 5000, 10000, 15000, 25000, 50000, 100000, 200000, 400000, 800000, 1500000, 3000000];
    const checkpoints = [5, 10];
    const formatPrize = new Intl.NumberFormat('ru-RU');
    const demo = [
      { question: 'Какая планета Солнечной системы самая большая?', answers: ['Земля', 'Сатурн', 'Юпитер', 'Нептун'], correct: 2 },
      { question: 'Какой химический элемент обозначают символом W?', answers: ['Вольфрам', 'Ванадий', 'Висмут', 'Водород'], correct: 0 },
      { question: 'Какой пролив разделяет Европу и Африку?', answers: ['Берингов', 'Гибралтарский', 'Ормузский', 'Магелланов'], correct: 1 },
      { question: 'Какой инструмент использует смычок?', answers: ['Арфа', 'Флейта', 'Труба', 'Виолончель'], correct: 3 },
      { question: 'На каком материке находятся Анды?', answers: ['Южная Америка', 'Африка', 'Австралия', 'Евразия'], correct: 0 },
      { question: 'Кто написал роман «Отцы и дети»?', answers: ['Лев Толстой', 'Иван Тургенев', 'Антон Чехов', 'Николай Гоголь'], correct: 1 },
      { question: 'Как называется единица электрического сопротивления?', answers: ['Вольт', 'Ватт', 'Ампер', 'Ом'], correct: 3 },
      { question: 'Кто написал картину «Ночной дозор»?', answers: ['Рубенс', 'Вермеер', 'Рембрандт', 'Ван Дейк'], correct: 2 },
      { question: 'Какая страна граничит с Португалией по суше?', answers: ['Испания', 'Франция', 'Италия', 'Андорра'], correct: 0 },
      { question: 'Какой композитор написал «Картинки с выставки»?', answers: ['Чайковский', 'Мусоргский', 'Римский-Корсаков', 'Бородин'], correct: 1 },
      { question: 'Как называется самая крупная луна Нептуна?', answers: ['Титан', 'Тритон', 'Ганимед', 'Фобос'], correct: 1 },
      { question: 'Как называлась столица империи инков?', answers: ['Теночтитлан', 'Тикаль', 'Куско', 'Чан-Чан'], correct: 2 },
      { question: 'Какой химический элемент обозначают символом Sn?', answers: ['Сурьма', 'Селен', 'Олово', 'Свинец'], correct: 2 },
      { question: 'Какое море не имеет сухопутных берегов?', answers: ['Коралловое', 'Карибское', 'Тасманово', 'Саргассово'], correct: 3 },
      { question: 'Как называется линия, соединяющая точки равного магнитного склонения?', answers: ['Изобата', 'Изогона', 'Изотерма', 'Изохрона'], correct: 1 }
    ];

    function readQuestions() {
      try {
        const saved = window.openai?.widgetState?.privateContent?.questions
          ?? JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(saved)) return saved;
      } catch { /* The preview may deny browser storage. */ }
      return demo;
    }

    let questions = readQuestions();
    let editing = -1;
    let index = 0;
    let score = 0;
    let roundLength = 0;
    let roundEnded = false;
    const usedHints = new Set();
    let phase = 'ready';
    let timer;
    let deadline;
    let speechTimeout;
    let utterance;
    let telegram;

    function setPhase(next) {
      phase = next;
      root.dataset.phase = next;
      delete status.dataset.outcome;
      sidebar.hidden = next === 'ready' || next === 'done';
      bank.hidden = true;
      updateHintButtons();
    }

    function updateHintButtons() {
      for (const button of hintButtons) {
        const used = usedHints.has(button.dataset.hint);
        button.disabled = phase !== 'answer' || used;
        button.toggleAttribute('data-used', used);
      }
    }

    function guaranteedPrize() {
      const level = checkpoints.reduce((reached, checkpoint) => checkpoint <= score ? checkpoint : reached, 0);
      return prizes[level - 1] ?? 0;
    }

    function renderStakes() {
      const guaranteed = guaranteedPrize();
      const stake = formatPrize.format(prizes[index]) + ' ₽';
      find('stakes').textContent = guaranteed ? stake + ' · Несгораемая: ' + formatPrize.format(guaranteed) + ' ₽' : stake;
      renderLadder(find('live-ladder'));
    }

    function renderLadder(list) {
      const rows = prizes.slice(0, roundLength).map((prize, position) => {
        const level = position + 1;
        const row = document.createElement('li');
        const label = document.createElement('span');
        const marker = document.createElement('small');
        const amount = document.createElement('span');
        label.textContent = String(level);
        marker.textContent = checkpoints.includes(level) ? 'Несгораемая' : '';
        row.toggleAttribute('data-milestone', level === roundLength || checkpoints.includes(level));
        row.toggleAttribute('data-secured', checkpoints.includes(level) && level <= score);
        amount.textContent = formatPrize.format(prize) + ' ₽';
        if (position === index) row.setAttribute('aria-current', 'step');
        row.append(label, marker, amount);
        return row;
      }).reverse();
      list.replaceChildren(...rows);
    }

    function showLadder() {
      renderLadder(find('ladder'));
      ladderDialog.showModal();
    }

    function useHint(type) {
      if (phase !== 'answer' || usedHints.has(type)) return;
      if (performance.now() >= deadline) {
        finishQuestion(-1);
        return;
      }
      usedHints.add(type);
      updateHintButtons();
      const correct = questions[index].correct;
      const buttons = Array.from(answers.querySelectorAll('.answer'));
      const available = buttons.map((button, position) => position).filter((position) => !buttons[position].disabled);
      const wrong = available.filter((position) => position !== correct);
      if (type === 'half') {
        const kept = wrong[Math.floor(Math.random() * wrong.length)];
        for (const position of wrong) {
          if (position === kept) continue;
          buttons[position].disabled = true;
          buttons[position].dataset.removed = '';
        }
        hint.textContent = '50:50 · Осталось два варианта.';
      } else if (type === 'audience') {
        const weights = available.map((position) => 12 + Math.random() * (position === correct ? 70 : 30));
        const total = weights.reduce((sum, weight) => sum + weight, 0);
        const votes = weights.map((weight) => Math.floor(weight * 100 / total));
        votes[weights.indexOf(Math.max(...weights))] += 100 - votes.reduce((sum, vote) => sum + vote, 0);
        hint.textContent = 'Виртуальный зал · ' + available.map((position, i) => letters[position] + ' ' + votes[i] + '%').join(' · ');
      } else {
        const suggestion = Math.random() < .75 ? correct : wrong[Math.floor(Math.random() * wrong.length)];
        hint.textContent = 'Виртуальный друг · «Я бы выбрал вариант ' + letters[suggestion] + '».';
      }
    }

    function applyTheme() {
      if (!telegram) return;
      const background = getComputedStyle(root).getPropertyValue('--stage').trim();
      telegram.setHeaderColor?.(telegram.isVersionAtLeast?.('6.9') ? background : 'bg_color');
      if (telegram.isVersionAtLeast?.('6.1')) telegram.setBackgroundColor(background);
      if (telegram.isVersionAtLeast?.('7.10')) telegram.setBottomBarColor(background);
    }

    function connectTelegram() {
      const webApp = window.Telegram?.WebApp;
      if (telegram || !webApp || (!webApp.initData && (!webApp.platform || webApp.platform === 'unknown'))) return;
      telegram = webApp;
      root.dataset.telegram = '';
      applyTheme();
      telegram.onEvent('themeChanged', applyTheme);
      telegram.BackButton?.onClick(() => {
        if (!editor.hidden) setEditorOpen(false);
      });
      if (!editor.hidden) telegram.BackButton?.show();
      telegram.ready();
      telegram.expand();
    }

    voice.disabled = !synth || !window.SpeechSynthesisUtterance;
    if (voice.disabled) {
      voice.checked = false;
      find('voice-option').hidden = true;
    }

    function updateClock(seconds) {
      clock.textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
      clock.classList.toggle('urgent', seconds <= 10);
      progress.classList.toggle('urgent', seconds <= 10);
      progress.value = seconds;
    }

    function stopSpeech() {
      clearTimeout(speechTimeout);
      if (!utterance) return;
      utterance.onend = null;
      utterance.onerror = null;
      utterance = null;
      synth.cancel();
    }

    function stopRound() {
      clearInterval(timer);
      stopSpeech();
    }

    function renderQuestion() {
      const item = questions[index];
      const formatNumber = (number) => String(number).padStart(2, '0');
      counter.textContent = 'Вопрос ' + formatNumber(index + 1) + ' / ' + formatNumber(roundLength);
      clockRow.hidden = false;
      find('round-tools').hidden = false;
      renderStakes();
      hint.textContent = '';
      question.textContent = item.question;
      answers.replaceChildren(...item.answers.map((answer, position) => {
        const button = document.createElement('button');
        const letter = document.createElement('span');
        const mark = document.createElement('span');
        const text = document.createElement('span');
        letter.className = 'letter';
        letter.textContent = letters[position];
        mark.className = 'answer-mark';
        mark.setAttribute('aria-hidden', 'true');
        text.className = 'answer-text';
        text.textContent = answer;
        button.type = 'button';
        button.className = 'answer';
        button.disabled = true;
        button.append(letter, text, mark);
        button.addEventListener('click', () => finishQuestion(position));
        return button;
      }));
      updateClock(60);
    }

    function showReady() {
      stopRound();
      roundLength = Math.min(questions.length, prizes.length);
      roundEnded = false;
      usedHints.clear();
      setPhase('ready');
      index = score = 0;
      const topPrize = roundLength ? formatPrize.format(prizes[roundLength - 1]) + ' ₽' : '';
      find('studio-note').hidden = !roundLength;
      find('studio-note').textContent = 'Главный приз · ' + topPrize;
      find('top-prize').textContent = topPrize;
      clockRow.hidden = true;
      find('round-tools').hidden = true;
      hint.textContent = '';
      question.textContent = roundLength ? 'Готовы сыграть?' : 'Добавьте первый вопрос';
      answers.replaceChildren();
      action.hidden = false;
      action.disabled = roundLength === 0;
      action.textContent = 'Начать игру';
      find('voice-option').hidden = voice.disabled || !roundLength;
      status.textContent = roundLength ? 'Вопросов: ' + roundLength + ' · Три подсказки' : 'Откройте редактор, чтобы начать.';
    }

    function startTimer(message = 'Выберите один ответ') {
      stopSpeech();
      const focusWasOnAction = document.activeElement === action;
      setPhase('answer');
      status.textContent = message;
      action.hidden = true;
      root.querySelectorAll('.answer').forEach((button) => { button.disabled = false; });
      if (focusWasOnAction) question.focus({ preventScroll: true });
      deadline = performance.now() + 60000;
      timer = setInterval(() => {
        const left = Math.max(0, Math.ceil((deadline - performance.now()) / 1000));
        updateClock(left);
        if (left === 0) finishQuestion(-1);
      }, 150);
    }

    function playQuestion() {
      renderQuestion();
      find('voice-option').hidden = true;
      if (!voice.checked) {
        startTimer();
        return;
      }
      const item = questions[index];
      const russian = synth.getVoices().filter((entry) => /^ru(?:-|$)/i.test(entry.lang));
      const selectedVoice = russian.find((entry) => entry.localService) ?? russian[0];
      if (!selectedVoice) {
        startTimer('Русский голос недоступен. Выберите ответ.');
        return;
      }
      setPhase('speaking');
      status.textContent = 'Звучит вопрос…';
      action.hidden = false;
      action.textContent = 'Пропустить озвучку';
      const spoken = [item.question, ...item.answers].join('\n');
      utterance = new SpeechSynthesisUtterance(spoken);
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
      utterance.rate = 0.93;
      utterance.onend = () => startTimer();
      utterance.onerror = () => startTimer('Озвучка недоступна. Выберите ответ.');
      speechTimeout = setTimeout(() => startTimer('Озвучка прервана. Выберите ответ.'), Math.max(12000, spoken.length * 160));
      synth.speak(utterance);
    }

    function finishQuestion(position) {
      if (phase !== 'answer') return;
      if (performance.now() >= deadline) {
        position = -1;
        updateClock(0);
      }
      stopRound();
      const focusWasOnAnswer = answers.contains(document.activeElement);
      setPhase('review');
      const item = questions[index];
      const correct = position === item.correct;
      if (correct) score += 1;
      renderStakes();
      roundEnded = !correct || score === roundLength;
      root.querySelectorAll('.answer').forEach((button, number) => {
        button.disabled = true;
        if (number === item.correct || number === position) {
          const isCorrect = number === item.correct;
          button.classList.add(isCorrect ? 'correct' : 'wrong');
          button.querySelector('.answer-mark').textContent = isCorrect ? '✓' : '×';
        }
      });
      status.dataset.outcome = correct ? 'success' : 'error';
      status.textContent = correct ? 'Верно!' : (position === -1 ? 'Время вышло. ' : 'Неверно. ')
        + 'Правильный ответ — ' + item.answers[item.correct] + '.';
      action.hidden = false;
      action.textContent = roundEnded ? 'Показать результат' : 'Дальше';
      bank.hidden = roundEnded;
      bank.textContent = 'Забрать ' + formatPrize.format(prizes[score - 1] ?? 0) + ' ₽';
      if (focusWasOnAnswer) action.focus({ preventScroll: true });
      if (position !== -1) telegram?.HapticFeedback?.notificationOccurred(correct ? 'success' : 'error');
    }

    function showResult(prize) {
      setPhase('done');
      find('studio-note').textContent = 'Ваш выигрыш';
      clockRow.hidden = true;
      find('round-tools').hidden = true;
      hint.textContent = '';
      question.textContent = formatPrize.format(prize) + ' ₽';
      answers.replaceChildren();
      status.textContent = 'Верных ответов: ' + score + ' из ' + roundLength;
      action.textContent = 'Играть ещё';
      question.focus({ preventScroll: true });
    }

    find('show-ladder').addEventListener('click', showLadder);
    find('close-ladder').addEventListener('click', () => ladderDialog.close());
    hintButtons.forEach((button) => button.addEventListener('click', () => useHint(button.dataset.hint)));
    bank.addEventListener('click', () => {
      if (phase === 'review' && !roundEnded) showResult(prizes[score - 1]);
    });
    action.addEventListener('click', () => {
      if (phase === 'ready') playQuestion();
      else if (phase === 'speaking') startTimer();
      else if (phase === 'review') {
        if (roundEnded) {
          showResult(score === roundLength ? prizes[score - 1] : guaranteedPrize());
        } else {
          index += 1;
          playQuestion();
        }
      } else if (phase === 'done') showReady();
    });

    function openQuestion(position) {
      editing = position;
      const item = questions[position];
      form.elements.question.value = item?.question ?? '';
      letters.forEach((letter, number) => {
        form.elements[letter.toLowerCase()].value = item?.answers[number] ?? '';
      });
      form.elements.correct.value = String(item?.correct ?? 0);
      find('delete').hidden = position < 0;
      editorStatus.textContent = '';
      delete editorStatus.dataset.error;
      questionPicker.replaceChildren(...questions.map((entry, number) =>
        new Option((number + 1) + '. ' + entry.question, number)));
      if (position < 0) {
        const label = questions.length ? 'Новый вопрос' : 'Вопросов пока нет';
        questionPicker.add(new Option(label, -1), 0);
      }
      questionPicker.disabled = questions.length === 0;
      questionPicker.value = String(position);
    }

    function saveQuestions(message) {
      let stored = false;
      const serialized = JSON.stringify(questions);
      try {
        localStorage.setItem(storageKey, serialized);
        stored = true;
      } catch { /* Fall back to the preview host or in-memory state. */ }
      editorStatus.textContent = stored ? message : message + ' Изменения доступны в открытом прототипе.';
      if (window.openai?.setWidgetState && new TextEncoder().encode(serialized).length < 15000) {
        window.openai.setWidgetState({ privateContent: { questions } }).then(() => {
          if (editorStatus.textContent.startsWith(message)) editorStatus.textContent = message;
        }).catch(() => {});
      }
    }

    function setEditorOpen(opening) {
      stopRound();
      editor.hidden = !opening;
      game.hidden = opening;
      find('editor-title').hidden = !opening;
      editButton.textContent = opening ? 'К игре' : 'Редактор';
      if (opening) {
        openQuestion(questions.length ? 0 : -1);
        telegram?.BackButton?.show();
      } else {
        showReady();
        telegram?.BackButton?.hide();
      }
      if (telegram) window.scrollTo(0, 0);
    }

    editButton.addEventListener('click', () => setEditorOpen(editor.hidden));
    questionPicker.addEventListener('change', () => openQuestion(Number(questionPicker.value)));
    find('add').addEventListener('click', () => {
      openQuestion(-1);
      form.elements.question.focus();
    });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const questionText = form.elements.question.value.trim();
      const answers = letters.map((letter) => form.elements[letter.toLowerCase()].value.trim());
      if (!questionText || answers.some((answer) => !answer)) {
        editorStatus.dataset.error = '';
        editorStatus.textContent = 'Заполните вопрос и все четыре варианта.';
        return;
      }
      const position = editing < 0 ? questions.length : editing;
      questions[position] = { question: questionText, answers, correct: Number(form.elements.correct.value) };
      openQuestion(position);
      saveQuestions('Вопрос сохранён.');
    });
    find('delete').addEventListener('click', () => {
      questions.splice(editing, 1);
      openQuestion(Math.min(editing, questions.length - 1));
      saveQuestions('Вопрос удалён.');
    });
    window.addEventListener('openai:set_globals', (event) => {
      const saved = event.detail?.globals?.widgetState?.privateContent?.questions;
      if (!Array.isArray(saved) || phase !== 'ready' || !editor.hidden) return;
      questions = saved;
      showReady();
    });

    window.addEventListener('quiz:telegram-ready', connectTelegram, { once: true });
    showReady();
    connectTelegram();
  })();
</script>
</html>
